---
  - name: Create directory /root/selenoid
    file:
      path: /root/selenoid
      state: directory
      mode: '0755'
  - name: Create grid-router parent directory
    file:
      path: /root/selenoid/grid-router
      state: directory
      mode: '0755'
  - name: Create jenkins parent directory
    file:
      path: /root/selenoid/jenkins
      state: directory
      mode: '0755'
  - name: Copy job.ini
    copy:
      src: jenkins/job.ini
      dest: /root/selenoid/jenkins/job.ini
      mode: '0644'
  - name: Create jenkins jenkins_home directory
    file:
      path: /root/selenoid/jenkins/jenkins_home
      state: directory
      mode: '0755'
  - name: Create jenkins registry directory
    file:
      path: /root/selenoid/jenkins/registry
      state: directory
      mode: '0755'
  - name: Create jenkins slaves directories
    file:
      path: /root/selenoid/jenkins/slaves
      state: directory
      mode: '0755'
  - name: Copy slaves files
    copy:
      src: jenkins/slaves/{{ item }}
      dest: /root/selenoid/jenkins/slaves/{{ item }}
      mode: '0644'
    loop:
      - Dockerfile.maven
      - Dockerfile.python
  - name: Create jenkins jobs directory
    file:
      path: /root/selenoid/jenkins/jobs
      state: directory
      mode: '0755'
  - name: Create jenkins jobs macroses directory
    file:
      path: /root/selenoid/jenkins/jobs/macroses
      state: directory
      mode: '0755'
  - name: Copy macroses files
    copy:
      src: jenkins/jobs/macroses/{{ item }}
      dest: /root/selenoid/jenkins/jobs/macroses/{{ item }}
      mode: '0644'
    loop:
        - git-job-updater.yaml
        - mobile-test-runner.yaml
        - rest-test-runner.yaml
        - ui-test-runner.yaml
  - name: Create jenkins jobs templates directory
    file:
      path: /root/selenoid/jenkins/jobs/templates
      state: directory
      mode: '0755'
  - name: Copy templates files
    copy:
      src: jenkins/jobs/templates/{{ item }}
      dest: /root/selenoid/jenkins/jobs/templates/{{ item }}
      mode: '0644'
    loop:
      - jobs-updater.yaml
      - mobile-test-runner.yaml
      - rest-test-runner.yaml
      - ui-test-runner.yaml
  - name: Copy jobs files
    copy:
      src: jenkins/jobs/{{ item }}
      dest: /root/selenoid/jenkins/jobs/{{ item }}
      mode: '0644'
    loop:
      - global.yaml
      - project.yaml
      - view.yaml
  - name: Create jenkins pipelines directory
    file:
      path: /root/selenoid/jenkins/pipelines
      state: directory
      mode: '0755'
  - name: Copy pipelines files
    copy:
      src: jenkins/pipelines/{{ item }}
      dest: /root/selenoid/jenkins/pipelines/{{ item }}
      mode: '0644'
    loop:
      - jobs-updater.groovy
      - runner.groovy
  - name: create browsers.json
    template:
      src: templates/browsers.json.j2
      dest: /root/selenoid/grid-router/browsers.json
    vars:
      browsers:
        - name: "chrome"
          versions:
            - version: "128.0"
              path: "/"
            - version: "127.0"
              path: "/"
        - name: "firefox"
          versions:
            - version: "125.0"
              path: "/wd/hub"
  - name: Create grid-router quota directories
    file:
      path: /root/selenoid/grid-router/quota
      state: directory
      mode: '0755'
  - name: copy grid-router quota
    copy:
      src: grid-router/quota/test.xml
      dest: /root/selenoid/grid-router/quota
      mode: '0644'
  - name: Create wiremock directory
    file:
      path: /root/selenoid/wiremock
      state: directory
      mode: '0755'
  - name: Create wiremock_stubs directory
    file:
      path: /root/selenoid/wiremock/wiremock_stubs
      state: directory
      mode: '0755'
  - name: Copy wiremock stubs
    copy:
      src: wiremock/wiremock_stubs/{{ item }}
      dest: /root/selenoid/wiremock/wiremock_stubs/{{ item }}
      mode: '0644'
    loop:
      - course_get_all.json
      - user_get_id.json
      - user_get_all.json
      - soap_course_get_all.json
      - soap_user_get_all.json
      - soap_user_get_id.json
  - name: Create nginx parent directory
    file:
      path: /root/selenoid/nginx
      state: directory
      mode: '0755'
  - name: Copy nginx config
    copy:
      src: nginx/selenoid.conf
      dest: /root/selenoid/nginx/selenoid.conf
      mode: '0644'
  - name: Generate users.htpasswd
    template:
      src: templates/users.htpasswd.j2
      dest: /root/selenoid/grid-router/users.htpasswd
      mode: '0644'
  - name: Copy docker-compose.yml
    copy:
      src: docker-compose.yml
      dest: /root/selenoid/docker-compose.yml
      mode: '0644'
  - name: running selenoid via docker compose
    shell: docker compose up -d
    args:
      chdir: /root/selenoid
    register: compose_result
  - name: Show compose output
    debug:
      var: compose_result
  - name: Add iptables rule for Docker network masquerading
    shell: iptables -t nat -A POSTROUTING -s {{ item }} ! -o docker0 -j MASQUERADE
    loop:
      - 172.20.0.0/24
      - 172.21.0.0/24
  - name: restart wiremock
    shell: docker compose up -d --force-recreate wiremock
    args:
      chdir: /root/selenoid