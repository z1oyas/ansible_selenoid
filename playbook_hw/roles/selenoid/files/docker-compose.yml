services:

  selenoid1:
    image: aerokube/selenoid:1.11.3
    container_name: selenoid1
    hostname: selenoid1
    networks:
      selenoid_net1:
        ipv4_address: 172.20.0.10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./grid-router/browsers.json:/etc/selenoid/browsers.json:ro
      - ./video:/opt/selenoid/video
    command: -container-network selenoid_net1 -limit 10 -video-output-dir /opt/selenoid/video

  selenoid2:
    image: aerokube/selenoid:1.11.3
    container_name: selenoid2
    hostname: selenoid2
    networks:
      selenoid_net2:
        ipv4_address: 172.21.0.10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./grid-router/browsers.json:/etc/selenoid/browsers.json:ro
      - ./video:/opt/selenoid/video
    command: -container-network selenoid_net2 -limit 10 -video-output-dir /opt/selenoid/video

  ggr:
    image: aerokube/ggr:1.7.2
    container_name: ggr
    hostname: ggr
    depends_on:
      - selenoid1
      - selenoid2
    volumes:
      - ./grid-router:/etc/grid-router:ro
    command: -guests-allowed -guests-quota "test" -verbose -quotaDir /etc/grid-router/quota
    networks:
      - selenoid_net1
      - selenoid_net2

  ggr-ui:
    image: aerokube/ggr-ui:1.2.0
    container_name: ggr-ui
    hostname: ggr_ui
    depends_on:
      - ggr
    volumes:
      - ./grid-router:/etc/grid-router:ro
    networks:
      - selenoid_net1
      - selenoid_net2

  selenoid-ui:
    image: aerokube/selenoid-ui:1.10.11
    container_name: selenoid-ui
    hostname: selenoid-ui
    depends_on:
      - ggr-ui
    networks:
      - selenoid_net1
    command: --selenoid-uri http://ggr_ui:8888

  registry:
    image: registry:latest
    container_name: registry
    hostname: registry
    restart: always
    ports:
      - 5005:5000
    volumes:
      - ./jenkins/registry:/var/lib/registry
    networks:
      - selenoid_net1

  jenkins:
    image: jenkins/jenkins:2.522-jdk21
    container_name: jenkins
    hostname: jenkins
    restart: always
    privileged: true
    depends_on:
      - registry
    user: root
    ports:
      - 8080:8080
    environment:
      JAVA_OPTS: >-
        -Dhudson.model.DownloadService.noSignatureCheck=true 
        -Dhudson.model.DirectoryBrowserSupport.CSP="sandbox allow-scripts allow-same-origin; default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline';"
        -Dhudson.model.UpdateCenter.never=true
        -Dcom.sun.net.ssl.checkRevocation=false
        -Djava.net.useSystemProxies=true
      DOCKER_OPTS: "-H tcp://0.0.0.0:2376 -H unix:///var/run/docker.sock"
      DOCKER_HOST: "unix:///var/run/docker.sock"
      JENKINS_OPTS: "--prefix=/jenkins"
    volumes:
      - ./jenkins/jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - selenoid_net1

  nginx:
    image: nginx:latest
    container_name: nginx
    hostname: nginx
    restart: always
    privileged: true
    depends_on:
      - ggr
      - selenoid-ui
      - jenkins
    ports:
      - 80:80
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - selenoid_net1

networks:
  selenoid_net1:
    name: selenoid_net1
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
  selenoid_net2:
    name: selenoid_net2
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/24